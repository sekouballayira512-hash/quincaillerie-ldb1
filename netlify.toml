# Netlify Configuration for Quincaillerie LDB
[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and OAuth popup headers
[[headers]]
  for = "/*"
  [headers.values]
    # Allow Firebase Auth popup to communicate back with the main window
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
